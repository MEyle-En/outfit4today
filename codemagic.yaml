workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: 16.4
      groups:
        - appstore_credentials
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Compile web code
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up keychain
        script: keychain initialize
      - name: Decode certificate and copy provisioning profile
        script: |
          echo "$O4T_P12_BASE64" | base64 --decode > /tmp/dist.p12
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "ios/signing/o4t-appstore.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          ls -la /tmp/dist.p12 "$HOME/Library/MobileDevice/Provisioning Profiles"
      - name: Add certificate to keychain
        script: keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$O4T_P12_PASSWORD"
      - name: Apply manual signing settings and create export options
        script: |
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/o4t-appstore.mobileprovision"
          /usr/bin/security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist
          UUID=$(plutil -extract UUID raw /tmp/profile.plist)
          NAME=$(plutil -extract Name raw /tmp/profile.plist)
          echo "Profile NAME=$NAME UUID=$UUID"
          cd ios/App
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"Apple Distribution\"; DEVELOPMENT_TEAM = 6624786S9P; PROVISIONING_PROFILE_SPECIFIER = \"$NAME\";/" App.xcodeproj/project.pbxproj
          if ! grep -q PROVISIONING_PROFILE_SPECIFIER App.xcodeproj/project.pbxproj; then
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = /PROVISIONING_PROFILE_SPECIFIER = \"$NAME\"; CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"Apple Distribution\"; DEVELOPMENT_TEAM = 6624786S9P; PRODUCT_BUNDLE_IDENTIFIER = /" App.xcodeproj/project.pbxproj
          fi
          cd /Users/builder
          cat > export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>6624786S9P</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>-www.Emel.Outfit4Today</key>
              <string>$NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          cat export_options.plist
          cd /Users/builder/clone
      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa --workspace "App.xcworkspace" --scheme "App"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "===== XCODEBUILD ERROR LINES ====="
            grep -rh "error:" /tmp/xcodebuild_logs/ 2>/dev/null | tail -40
          fi
          exit $rc
      - name: Decode ASC API key to file (auto-detect)
        script: |
          RAW="$APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY"
          OUT=/tmp/AuthKey.p8
          if printf '%s' "$RAW" | grep -q -- '-----BEGIN'; then
            echo 'MODE: roher PEM in env var erkannt'
            if printf '%s' "$RAW" | grep -q '\\n'; then
              echo '  -> literale Backslash-n werden zu echten Umbruechen'
              printf '%s' "$RAW" | sed 's/\\n/\n/g' > "$OUT"
            else
              printf '%s\n' "$RAW" > "$OUT"
            fi
          else
            echo 'MODE: Base64 in env var angenommen -> dekodieren'
            printf '%s' "$RAW" | tr -d '[:space:]' | base64 --decode > "$OUT"
          fi
          chmod 600 "$OUT"
          echo '=== SELF-CHECK: erste 2 Zeilen ==='
          head -2 "$OUT"
          echo '=== Byte-Count ==='
          wc -c "$OUT"
      - name: Upload to App Store Connect and submit to TestFlight
        script: |
          app-store-connect publish \
            --path ios/App/build/ios/ipa/App.ipa \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key /tmp/AuthKey.p8 \
            --testflight \
            --max-build-processing-wait 0
          echo "===== PUBLISH EXIT CODE: $? ====="
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log