workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 20
      groups:
        - appstore_credentials
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Compile web code
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up keychain
        script: keychain initialize
      - name: Decode certificate and provisioning profile
        script: |
          echo "$O4T_P12_BASE64" | base64 --decode > /tmp/dist.p12
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$O4T_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/o4t-appstore.mobileprovision"
          ls -la /tmp/dist.p12 "$HOME/Library/MobileDevice/Provisioning Profiles"
      - name: Add certificate to keychain
        script: keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$O4T_P12_PASSWORD"
      - name: Use provisioning profile
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true