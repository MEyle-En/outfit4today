workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 20
      groups:
        - appstore_credentials
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Compile web code
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up keychain
        script: keychain initialize
      - name: Decode certificate and copy provisioning profile
        script: |
          echo "$O4T_P12_BASE64" | base64 --decode > /tmp/dist.p12
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "ios/signing/o4t-appstore.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          ls -la /tmp/dist.p12 "$HOME/Library/MobileDevice/Provisioning Profiles"
      - name: Add certificate to keychain
        script: keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$O4T_P12_PASSWORD"
      - name: Apply manual signing settings to Xcode project
        script: |
          set -e
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/o4t-appstore.mobileprovision"
          /usr/bin/security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist
          UUID=$(plutil -extract UUID raw /tmp/profile.plist)
          NAME=$(plutil -extract Name raw /tmp/profile.plist)
          echo "Profile NAME=$NAME UUID=$UUID"
          cd ios/App
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"Apple Distribution\"; DEVELOPMENT_TEAM = 6624786S9P; PROVISIONING_PROFILE_SPECIFIER = \"$NAME\";/" App.xcodeproj/project.pbxproj
          if ! grep -q PROVISIONING_PROFILE_SPECIFIER App.xcodeproj/project.pbxproj; then
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = /PROVISIONING_PROFILE_SPECIFIER = \"$NAME\"; CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"Apple Distribution\"; DEVELOPMENT_TEAM = 6624786S9P; PRODUCT_BUNDLE_IDENTIFIER = /" App.xcodeproj/project.pbxproj
          fi
          grep -n "PROVISIONING_PROFILE_SPECIFIER" App.xcodeproj/project.pbxproj || true
          grep -n "CODE_SIGN_STYLE" App.xcodeproj/project.pbxproj || true
      - name: Build IPA
        script: xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true