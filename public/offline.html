<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Offline · Outfit4Today</title>
    <style>
      html, body { margin: 0; height: 100%; background: #09090b; color: #fafafa; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
      .icon { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #a855f7, #ec4899); display: grid; place-items: center; font-size: 34px; box-shadow: 0 0 40px -8px rgba(168, 85, 247, 0.6); }
      h1 { margin: 6px 0 0; font-size: 22px; }
      p { margin: 0; max-width: 300px; color: #a1a1aa; font-size: 14px; line-height: 1.5; }
      button { margin-top: 10px; border: 0; border-radius: 14px; background: #a855f7; color: #fff; font-size: 15px; font-weight: 600; padding: 12px 22px; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">👗</div>
      <h1>Du bist offline</h1>
      <p>Outfit4Today braucht eine Internetverbindung, um deinen Kleiderschrank zu laden. Prüfe deine Verbindung und versuche es nochmal.</p>
      <p lang="en">You're offline. Please check your connection and try again.</p>
      <button onclick="location.reload()">Erneut versuchen / Retry</button>
    </main>
  </body>
</html>
